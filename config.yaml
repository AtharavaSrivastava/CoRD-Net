# ==========================================
# Dataset
# ==========================================
dataset:
  name: OAI
  image_size: 229
  num_classes: 5

# ==========================================
# Data Split
# ==========================================
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

# ==========================================
# Model
# ==========================================
model:
  backbone: convnext_tiny
  pretrained: true
  in_channels: 3
  num_classes: 5

# ==========================================
# Training
# ==========================================
training:
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 16
  epochs: 100

# ==========================================
# Augmentation
# ==========================================
augmentation:

  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: 8

  rotation:
    enabled: true
    degrees: 10

  translation:
    enabled: true
    horizontal: 0.05
    vertical: 0.05

  scaling:
    enabled: true
    min_scale: 0.9
    max_scale: 1.1

  brightness:
    enabled: true
    factor: 0.15

  contrast:
    enabled: true
    factor: 0.15

  gaussian_noise:
    enabled: true
    sigma_min: 0.01
    sigma_max: 0.03

# ==========================================
# Normalization
# ==========================================
normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

